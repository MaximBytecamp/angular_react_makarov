services:
  n8n:
    image: n8nio/n8n:2.45.4
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Moscow
      - TZ=Europe/Moscow
      - N8N_DEFAULT_LOCALE=en
    volumes:
      - n8n_data:/home/node/.n8n

  pocketbase:
    build: ./pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data

volumes:
  n8n_data:
  pb_data:
